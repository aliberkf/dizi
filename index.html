<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dizi Takip">
<title>Dizi Takip</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📺%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0e1014; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#eef0f4; --muted:#9aa3b2; --dim:#6b7383;
    --accent:#ffc93c; --accent-ink:#1a1400; --ok:#3ddc97; --danger:#ff6b6b;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  img{display:block}
  .app{max-width:760px;margin:0 auto;padding:0 14px 96px}

  header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 75%,transparent);
    padding:calc(14px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;gap:10px}
  header h1{font-size:20px;margin:0;font-weight:750;letter-spacing:-.2px;flex:1}
  header h1 span{color:var(--accent)}
  .sync{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;
    padding:7px 10px;border-radius:99px;background:var(--panel)}
  .sync svg{width:15px;height:15px}
  .sync.spin svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .me{width:32px;height:32px;border-radius:50%;overflow:hidden;background:var(--panel);flex:none}
  .me img{width:100%;height:100%;object-fit:cover}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(14,16,20,.92);
    backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
  nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;
    color:var(--dim);font-size:11.5px;font-weight:600;position:relative}
  nav button svg{width:22px;height:22px}
  nav button.on{color:var(--accent)}
  nav .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--accent);color:var(--accent-ink);
    font-size:10px;font-weight:800;border-radius:99px;padding:1px 5px;min-width:17px;text-align:center}

  h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);
    margin:22px 2px 10px;font-weight:700}
  h2 .n{color:var(--dim);font-weight:600}

  .card{background:var(--panel);border-radius:var(--r);padding:10px;display:flex;gap:12px;
    align-items:center;margin-bottom:8px}
  .poster{width:58px;aspect-ratio:2/3;border-radius:8px;object-fit:cover;background:var(--panel2);flex:none}
  .poster.sm{width:40px;border-radius:6px}
  .poster.lg{width:96px;border-radius:10px}
  .ph{display:flex;align-items:center;justify-content:center;color:var(--dim);font-weight:800;font-size:18px}
  .grow{flex:1;min-width:0}
  .t1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t2{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t3{color:var(--dim);font-size:12.5px;margin-top:2px}
  .code{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;
    background:var(--panel2);color:var(--muted);vertical-align:1px}
  .pill.new{background:rgba(255,201,60,.15);color:var(--accent)}

  .btn{background:var(--panel2);border-radius:10px;padding:9px 13px;font-weight:650;font-size:14px;white-space:nowrap}
  .btn.pri{background:var(--accent);color:var(--accent-ink)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .btn.danger{color:var(--danger)}
  .btn:disabled{opacity:.5}
  .check{width:40px;height:40px;border-radius:50%;flex:none;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:transparent;transition:.15s}
  .check svg{width:20px;height:20px}
  .check:hover{border-color:var(--accent);color:var(--dim)}
  .check.on{background:var(--ok);border-color:var(--ok);color:#06210f}

  .day{margin-top:18px}
  .day h3{margin:0 2px 8px;font-size:14px;font-weight:700}
  .day h3 small{color:var(--dim);font-weight:500;margin-left:6px}
  .time{font-size:12.5px;color:var(--muted);text-align:right;flex:none}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .tile{background:var(--panel);border-radius:var(--r);overflow:hidden;text-align:left;display:flex;flex-direction:column}
  .tile img,.tile .ph{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--panel2)}
  .tile .b{padding:9px 10px 11px}
  .bar{height:5px;background:var(--panel2);border-radius:9px;overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
  .bar.done i{background:var(--ok)}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-top:4px}
  .chip{padding:7px 13px;border-radius:99px;background:var(--panel);color:var(--muted);font-weight:650;font-size:13.5px;white-space:nowrap}
  .chip.on{background:var(--text);color:var(--bg)}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
  .stat{background:var(--panel);border-radius:12px;padding:10px 12px}
  .stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
  .stat span{color:var(--muted);font-size:12px}

  .search{display:flex;gap:8px;margin-top:8px}
  .search input{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:12px 14px;font:inherit;outline:none;min-width:0}
  .search input:focus{border-color:var(--accent)}
  .hint{color:var(--dim);font-size:12.5px;margin:8px 2px 0}
  .res .ozet{color:var(--dim);font-size:12.5px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .empty{text-align:center;color:var(--muted);padding:48px 20px}
  .empty .big{font-size:40px;margin-bottom:8px}

  /* Detay sayfası */
  .sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;display:none}
  .sheet.open{display:block}
  .sheet .app{padding-bottom:40px}
  .dhead{display:flex;gap:14px;align-items:flex-end;margin-top:6px}
  .dhead h1{font-size:22px;margin:0 0 4px;line-height:1.2}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .links a{color:var(--muted);font-size:12.5px;text-decoration:none;border:1px solid var(--line);padding:4px 9px;border-radius:99px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .season{background:var(--panel);border-radius:var(--r);margin-top:10px;overflow:hidden}
  .season summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
  .season summary::-webkit-details-marker{display:none}
  .season summary .chev{transition:.2s;color:var(--dim)}
  .season[open] summary .chev{transform:rotate(90deg)}
  .ep{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
  .ep.future{opacity:.55}
  .ep .upto{color:var(--dim);font-size:11.5px;padding:6px 8px;border-radius:8px}
  .ep .upto:hover{background:var(--panel2);color:var(--text)}
  .ep .check{width:32px;height:32px}
  .ep .check svg{width:16px;height:16px}

  .toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--text);color:var(--bg);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;
    display:flex;gap:14px;align-items:center;z-index:40;transition:.2s;max-width:92vw;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .toast.err{background:var(--danger);color:#fff}
  .toast button{color:#7a5a00;font-weight:800;white-space:nowrap}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
  .modal.open{display:flex}
  .modal .box{background:var(--panel);border-radius:16px;padding:20px;max-width:380px;width:100%}
  .modal h3{margin:0 0 8px}
  .modal p{color:var(--muted);margin:0 0 16px}
  .modal .row{display:flex;gap:8px;justify-content:flex-end}

  .loading{display:flex;justify-content:center;padding:60px 0;color:var(--muted)}
  footer{color:var(--dim);font-size:11.5px;text-align:center;margin-top:30px}
  footer a{color:var(--dim)}

  /* Giriş kapısı */
  .gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
  .gate.open{display:flex}
  .gate .box{text-align:center;max-width:340px}
  .gate .big{font-size:48px;margin-bottom:10px}
  .gate h1{margin:0 0 6px;font-size:24px}
  .gate h1 span{color:var(--accent)}
  .gate p{color:var(--muted);margin:0 0 22px}
  .gate .msg{background:rgba(255,107,107,.12);color:var(--danger);border-radius:10px;padding:10px;margin-bottom:16px;font-size:14px}
  #gsi{display:flex;justify-content:center;min-height:44px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Dizi <span>Takip</span></h1>
    <button class="sync" id="syncBtn" title="TVmaze'den şimdi güncelle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
      <span id="syncTxt">…</span>
    </button>
    <button class="me" id="meBtn" title="Çıkış yap" hidden></button>
  </header>
  <main id="main"><div class="loading">Yükleniyor…</div></main>
  <footer>Bölüm verisi <a href="https://www.tvmaze.com" target="_blank" rel="noopener">TVmaze</a> (CC BY-SA) · Verilerin kendi Google E-Tablonda saklanır.</footer>
</div>

<nav><div class="in">
  <button data-tab="next"><span class="badge" id="bNext" hidden></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="13" rx="2.5"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/><path d="M8 21h8"/></svg>Sıradaki</button>
  <button data-tab="upcoming">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Yaklaşan</button>
  <button data-tab="shows">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Dizilerim</button>
  <button data-tab="add">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/></svg>Ekle</button>
</div></nav>

<div class="sheet" id="sheet"><div class="app" id="detail"></div></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box"><h3 id="mT"></h3><p id="mP"></p>
  <div class="row"><button class="btn ghost" id="mNo">Vazgeç</button><button class="btn pri" id="mYes">Tamam</button></div></div></div>
<div class="gate" id="gate"><div class="box">
  <div class="big">📺</div>
  <h1>Dizi <span>Takip</span></h1>
  <p>Özel alan. Devam etmek için Google ile giriş yap.</p>
  <div class="msg" id="gateMsg" hidden></div>
  <div id="gsi"></div>
</div></div>

<script>
/* ───────── Ayarlar (rabialiberk.com ile aynı arka uç ve Google istemcisi) ───────── */
const CONFIG = {
  clientId: '947980331108-14cnedb8imc8kitosimt7rp1pbrh0nov.apps.googleusercontent.com',
  apiUrl: 'https://script.google.com/macros/s/AKfycbxb48z0y0Mzx1vLGyxF7KMUPSBRx07Ts0AYQHpEUhL68sDLhsgCA-ePNf9_2quX6JQfKg/exec',
};
const CACHE_KEY = 'diziTakipCache';
const TOKEN_KEY = 'diziTakip.idtoken';

/* ───────── Durum ───────── */
const S = {
  data: { shows: [], eps: [], lastSync: '' },
  tab: 'next', showFilter: 'watching', openShow: null,
  searchQ: '', searchRes: null, searching: false, adding: {}
};
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => (n < 10 ? '0' : '') + n;
const code = e => 'S' + pad(e.se) + 'E' + pad(e.n);

/* ───────── Google ile giriş ───────── */
let gisReady = null, pendingLogin = null;
function claims(token) {
  try { return JSON.parse(decodeURIComponent(escape(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))))); }
  catch (e) { return null; }
}
function session() {
  const t = localStorage.getItem(TOKEN_KEY); if (!t) return null;
  const c = claims(t); if (!c || !c.exp) return null;
  return { token: t, exp: c.exp * 1000, picture: c.picture, email: c.email };
}
function loadGis() {
  if (gisReady) return gisReady;
  gisReady = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = () => {
      google.accounts.id.initialize({
        client_id: CONFIG.clientId, auto_select: true, itp_support: true, use_fedcm_for_prompt: true,
        callback: r => {
          if (!r || !r.credential) return;
          localStorage.setItem(TOKEN_KEY, r.credential);
          if (pendingLogin) { pendingLogin(true); pendingLogin = null; }
          if (!booted) boot();
        }
      });
      res(google.accounts.id);
    };
    s.onerror = () => rej(new Error('Google giriş kütüphanesi yüklenemedi.'));
    document.head.appendChild(s);
  });
  return gisReady;
}
async function showGate(msg) {
  $('#gate').classList.add('open');
  $('#gateMsg').hidden = !msg; $('#gateMsg').textContent = msg || '';
  const id = await loadGis();
  $('#gsi').innerHTML = '';
  id.renderButton($('#gsi'), { theme: 'filled_black', size: 'large', text: 'signin_with', locale: 'tr', width: 260 });
}
async function silentRefresh() {
  const id = await loadGis();
  return new Promise(res => {
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    pendingLogin = fin; setTimeout(() => fin(false), 8000);
    try { id.prompt(n => { if (n.isNotDisplayed() || n.isSkippedMoment() || n.isDismissedMoment()) fin(false); }); }
    catch (e) { fin(false); }
  });
}
async function idToken() {
  let s = session();
  if (s && s.exp - Date.now() > 60000) return s.token;
  if (await silentRefresh()) { s = session(); if (s) return s.token; }
  const e = new Error('Oturum süresi doldu, yeniden giriş yap.'); e.code = 'auth'; throw e;
}
function signOut() {
  localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(CACHE_KEY);
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  location.reload();
}

/* ───────── Sunucu çağrıları (Apps Script web uygulaması) ───────── */
async function call(fn, ...args) {
  for (let attempt = 0; attempt < 2; attempt++) {
    const res = await fetch(CONFIG.apiUrl, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow',
      body: JSON.stringify({ idToken: await idToken(), action: 'dizi', payload: { fn, args } })
    });
    if (!res.ok) throw new Error('Sunucuya ulaşılamadı (' + res.status + ')');
    const d = await res.json();
    if (d.ok) return d.data;
    if (d.code === 'auth' && attempt === 0 && await silentRefresh()) continue;
    const e = new Error(d.error || 'Bilinmeyen hata'); e.code = d.code; throw e;
  }
}
function setData(d) {
  S.data = d;
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch (e) {}
  index(); render();
}

/* ───────── Türetilmiş veriler ───────── */
let byShow = {}, showMap = {};
function airTime(e) {
  if (e.a) return Date.parse(e.a);
  if (e.d) return Date.parse(e.d + 'T00:00:00');
  return NaN;
}
function isAired(e) { const t = airTime(e); return !isNaN(t) && t <= Date.now(); }
function index() {
  byShow = {}; showMap = {};
  S.data.shows.forEach(s => { showMap[s.id] = s; byShow[s.id] = []; });
  S.data.eps.forEach(e => { (byShow[e.s] = byShow[e.s] || []).push(e); });
  Object.values(byShow).forEach(l => l.sort((a, b) => a.se - b.se || a.n - b.n));
}
function progress(id) {
  const l = byShow[id] || [];
  const aired = l.filter(isAired);
  const watched = l.filter(e => e.w).length;
  const next = aired.find(e => !e.w) || null;
  const upcoming = l.find(e => !isAired(e) && !isNaN(airTime(e))) || null;
  const behind = aired.filter(e => !e.w).length;
  const lastW = l.reduce((m, e) => e.wt && e.wt > m ? e.wt : m, '');
  return { total: l.length, aired: aired.length, watched, next, upcoming, behind, lastW };
}

/* ───────── Biçimlendirme ───────── */
const fmtDay = new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'long', weekday: 'long' });
const fmtShort = new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
const fmtTime = new Intl.DateTimeFormat('tr-TR', { hour: '2-digit', minute: '2-digit' });
function localDayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function epDate(e) { // gün boyu bölümlerde ağın yerel tarihini kullan
  if (!e.h && e.d) { const [y, m, d] = e.d.split('-').map(Number); return new Date(y, m - 1, d); }
  return new Date(airTime(e));
}
function relDay(d) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  const diff = Math.round((x - today) / 864e5);
  if (diff === 0) return 'Bugün';
  if (diff === 1) return 'Yarın';
  if (diff === -1) return 'Dün';
  if (diff > 1 && diff < 7) return diff + ' gün sonra';
  if (diff < -1 && diff > -7) return -diff + ' gün önce';
  return null;
}
function dateLabel(e) {
  if (isNaN(airTime(e))) return 'Tarih belli değil';
  const d = epDate(e);
  const r = relDay(d);
  return (r || fmtShort.format(d)) + (e.h ? ' · ' + fmtTime.format(new Date(airTime(e))) : '');
}
function since(iso) {
  if (!iso) return 'hiç';
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (m < 1) return 'şimdi';
  if (m < 60) return m + ' dk önce';
  if (m < 1440) return Math.round(m / 60) + ' sa önce';
  return Math.round(m / 1440) + ' gün önce';
}
const STATUS = { 'Running': 'Devam ediyor', 'Ended': 'Bitti', 'To Be Determined': 'Belirsiz', 'In Development': 'Yapım aşamasında' };
function poster(s, cls) {
  return s && s.poster ? `<img class="poster ${cls || ''}" src="${esc(s.poster)}" loading="lazy" alt="">`
    : `<div class="poster ph ${cls || ''}">${esc((s && s.ad || '?').slice(0, 1))}</div>`;
}

/* ───────── Görünümler ───────── */
function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const active = S.data.shows.filter(s => s.aktif);
  const pending = active.filter(s => progress(s.id).next).length;
  $('#bNext').hidden = !pending; $('#bNext').textContent = pending;
  $('#syncTxt').textContent = since(S.data.lastSync);
  const v = { next: viewNext, upcoming: viewUpcoming, shows: viewShows, add: viewAdd }[S.tab];
  $('#main').innerHTML = v();
  if (S.openShow) renderDetail();
}

function viewNext() {
  const items = S.data.shows.filter(s => s.aktif).map(s => ({ s, p: progress(s.id) })).filter(x => x.p.next);
  if (!S.data.shows.length) return emptyState();
  if (!items.length) return `<div class="empty"><div class="big">🎉</div>Her şeyi izlemişsin! Yeni bölümler çıkınca burada görünecek.</div>`;
  // Yeni çıkanlar önce, sonra en son izlediklerin
  const week = Date.now() - 7 * 864e5;
  const fresh = items.filter(x => airTime(x.p.next) >= week).sort((a, b) => airTime(b.p.next) - airTime(a.p.next));
  const rest = items.filter(x => airTime(x.p.next) < week)
    .sort((a, b) => (b.p.lastW || '').localeCompare(a.p.lastW || '') || a.s.ad.localeCompare(b.s.ad, 'tr'));
  const card = ({ s, p }) => `
    <div class="card">
      <button data-open="${s.id}">${poster(s)}</button>
      <button class="grow" data-open="${s.id}" style="text-align:left">
        <div class="t1">${esc(s.ad)}</div>
        <div class="t2"><span class="code">${code(p.next)}</span> ${esc(p.next.t)}</div>
        <div class="t3">${dateLabel(p.next)}${p.behind > 1 ? ` · <span class="pill">+${p.behind - 1} bölüm daha</span>` : ''}</div>
      </button>
      <button class="check" data-watch="${p.next.i}" title="İzledim">${CHECK}</button>
    </div>`;
  return (fresh.length ? `<h2>Yeni çıkanlar <span class="n">${fresh.length}</span></h2>` + fresh.map(card).join('') : '')
       + (rest.length ? `<h2>İzlemeye devam et <span class="n">${rest.length}</span></h2>` + rest.map(card).join('') : '');
}

function viewUpcoming() {
  if (!S.data.shows.length) return emptyState();
  const now = Date.now(), horizon = now + 120 * 864e5;
  const list = S.data.eps.filter(e => showMap[e.s] && showMap[e.s].aktif && !isAired(e) && airTime(e) <= horizon)
    .sort((a, b) => airTime(a) - airTime(b));
  const tbd = S.data.shows.filter(s => s.aktif && s.durum !== 'Ended' && !progress(s.id).upcoming);
  if (!list.length && !tbd.length) return `<div class="empty"><div class="big">📅</div>Önümüzdeki 4 ayda yeni bölüm görünmüyor.</div>`;
  const groups = {};
  list.forEach(e => { const k = localDayKey(epDate(e)); (groups[k] = groups[k] || []).push(e); });
  let html = '';
  Object.keys(groups).forEach(k => {
    const d = epDate(groups[k][0]);
    const r = relDay(d);
    html += `<div class="day"><h3>${r && !/sonra/.test(r) ? r : fmtDay.format(d)}<small>${r && !/sonra/.test(r) ? fmtDay.format(d) : (r || '')}</small></h3>` +
      groups[k].map(e => { const s = showMap[e.s]; return `
        <button class="card" style="width:100%;text-align:left" data-open="${s.id}">
          ${poster(s, 'sm')}
          <div class="grow"><div class="t1">${esc(s.ad)}</div>
            <div class="t2"><span class="code">${code(e)}</span> ${esc(e.t)}</div></div>
          <div class="time">${e.h ? fmtTime.format(new Date(airTime(e))) : 'Gün içinde'}<div class="t3">${esc(s.kanal)}</div></div>
        </button>`; }).join('') + '</div>';
  });
  if (tbd.length) html += `<h2>Tarihi henüz açıklanmadı <span class="n">${tbd.length}</span></h2>` +
    tbd.map(s => `<button class="card" style="width:100%;text-align:left" data-open="${s.id}">${poster(s, 'sm')}
      <div class="grow"><div class="t1">${esc(s.ad)}</div><div class="t2">${esc(STATUS[s.durum] || s.durum)}</div></div></button>`).join('');
  return html;
}

function viewShows() {
  if (!S.data.shows.length) return emptyState();
  const all = S.data.shows.map(s => ({ s, p: progress(s.id) }));
  const cat = x => !x.s.aktif ? 'archive' : (x.p.watched >= x.p.aired && x.s.durum === 'Ended' && x.p.aired ? 'done' : 'watching');
  const counts = { watching: 0, done: 0, archive: 0 };
  all.forEach(x => counts[cat(x)]++);
  const list = all.filter(x => cat(x) === S.showFilter).sort((a, b) => a.s.ad.localeCompare(b.s.ad, 'tr'));
  const wEps = S.data.eps.filter(e => e.w);
  const mins = wEps.reduce((m, e) => m + (Number(e.r) || 0), 0);
  const chip = (k, l) => `<button class="chip ${S.showFilter === k ? 'on' : ''}" data-filter="${k}">${l} · ${counts[k]}</button>`;
  return `
    <div class="stats">
      <div class="stat"><b>${S.data.shows.length}</b><span>dizi</span></div>
      <div class="stat"><b>${wEps.length.toLocaleString('tr-TR')}</b><span>bölüm izlendi</span></div>
      <div class="stat"><b>${mins >= 1440 ? (mins / 1440).toFixed(1).replace('.', ',') + ' gün' : Math.round(mins / 60) + ' sa'}</b><span>ekran süresi</span></div>
    </div>
    <div class="chips" style="margin-top:14px">${chip('watching', 'İzliyorum')}${chip('done', 'Bitirdim')}${chip('archive', 'Arşiv')}</div>
    ${list.length ? `<div class="grid" style="margin-top:12px">` + list.map(({ s, p }) => {
      const pct = p.aired ? Math.round(100 * Math.min(p.watched, p.aired) / p.aired) : 0;
      return `<button class="tile" data-open="${s.id}">
        ${s.poster ? `<img src="${esc(s.poster)}" loading="lazy" alt="">` : `<div class="ph">${esc(s.ad.slice(0, 1))}</div>`}
        <div class="b"><div class="t1">${esc(s.ad)}</div>
          <div class="t3">${p.watched}/${p.aired} bölüm${p.behind ? ` · <span style="color:var(--accent)">${p.behind} geride</span>` : ''}</div>
          <div class="bar ${pct === 100 ? 'done' : ''}"><i style="width:${pct}%"></i></div></div>
      </button>`; }).join('') + `</div>` : `<div class="empty">Bu listede dizi yok.</div>`}`;
}

function viewAdd() {
  let res = '';
  if (S.searching) res = `<div class="loading">Aranıyor…</div>`;
  else if (S.searchRes && !S.searchRes.length) res = `<div class="empty">Sonuç bulunamadı. İngilizce adını ya da IMDb linkini dene.</div>`;
  else if (S.searchRes) res = S.searchRes.map(r => {
    const have = showMap[r.id];
    const btn = S.adding[r.id] ? `<button class="btn" disabled>Ekleniyor…</button>`
      : have ? (have.aktif ? `<button class="btn ghost" data-open="${r.id}">Takipte ✓</button>` : `<button class="btn" data-add="${r.id}">Geri al</button>`)
      : `<button class="btn pri" data-add="${r.id}">Ekle</button>`;
    return `<div class="card res">${poster({ poster: r.poster, ad: r.ad })}
      <div class="grow"><div class="t1">${esc(r.ad)} ${r.yil ? `<span style="color:var(--dim);font-weight:500">(${r.yil})</span>` : ''}</div>
        <div class="t2">${esc([r.kanal, STATUS[r.durum] || r.durum].filter(Boolean).join(' · '))}</div>
        <div class="ozet">${esc(r.ozet)}</div></div>${btn}</div>`;
  }).join('');
  return `<h2>Dizi ekle</h2>
    <form class="search" id="searchForm"><input id="q" placeholder="Dizi adı veya IMDb linki" value="${esc(S.searchQ)}" autocomplete="off">
      <button class="btn pri">Ara</button></form>
    <div class="hint">Örn: <i>Severance</i> ya da <i>https://www.imdb.com/title/tt11280740/</i>. Ekledikten sonra dizinin sayfasında "buraya kadar izledim" ile kaldığın yeri hızlıca işaretleyebilirsin.</div>
    <div style="margin-top:14px">${res}</div>`;
}

function emptyState() {
  return `<div class="empty"><div class="big">📺</div>Henüz takip ettiğin dizi yok.<br><br>
    <button class="btn pri" data-tab="add">İlk diziyi ekle</button></div>`;
}

/* ───────── Detay ───────── */
function renderDetail() {
  const s = showMap[S.openShow];
  if (!s) { closeDetail(); return; }
  const p = progress(s.id);
  const l = byShow[s.id] || [];
  const seasons = {};
  l.forEach(e => (seasons[e.se] = seasons[e.se] || []).push(e));
  const openSeason = p.next ? p.next.se : (p.upcoming ? p.upcoming.se : Math.max(...Object.keys(seasons).map(Number), 0));
  const prevOpen = {};
  document.querySelectorAll('#detail details').forEach(d => prevOpen[d.dataset.se] = d.open);
  const hasPrev = Object.keys(prevOpen).length > 0 && document.querySelector('#detail').dataset.show == s.id;

  $('#detail').dataset.show = s.id;
  $('#detail').innerHTML = `
    <header><button class="btn ghost" id="back">← Geri</button><div style="flex:1"></div></header>
    <div class="dhead">${poster(s, 'lg')}
      <div class="grow"><h1>${esc(s.ad)}</h1>
        <div class="t2">${esc([s.kanal, s.yil, STATUS[s.durum] || s.durum].filter(Boolean).join(' · '))}</div>
        <div class="t3">${p.watched}/${p.aired} bölüm izlendi${p.upcoming ? ' · Sıradaki yayın: ' + dateLabel(p.upcoming) : ''}</div>
        <div class="bar"><i style="width:${p.aired ? Math.round(100 * Math.min(p.watched, p.aired) / p.aired) : 0}%"></i></div>
      </div></div>
    <div class="links">
      ${s.imdb ? `<a href="https://www.imdb.com/title/${esc(s.imdb)}/" target="_blank" rel="noopener">IMDb ↗</a>` : ''}
      ${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">TVmaze ↗</a>` : ''}
    </div>
    <div class="actions">
      ${p.next ? `<button class="btn pri" data-watch="${p.next.i}">✓ ${code(p.next)} izledim</button>` : ''}
      <button class="btn" data-active="${s.id}" data-val="${s.aktif ? 0 : 1}">${s.aktif ? 'Arşivle' : 'Takibe geri al'}</button>
      <button class="btn danger" data-del="${s.id}">Sil</button>
    </div>
    ${!l.length && S.adding[s.id] ? '<div class="loading">Bölümler yükleniyor…</div>' : ''}
    ${Object.keys(seasons).map(Number).sort((a, b) => a - b).map(se => {
      const eps = seasons[se];
      const aired = eps.filter(isAired);
      const w = eps.filter(e => e.w).length;
      const allW = aired.length > 0 && aired.every(e => e.w);
      const open = hasPrev && se in prevOpen ? prevOpen[se] : se === openSeason;
      return `<details class="season" data-se="${se}" ${open ? 'open' : ''}>
        <summary><span class="chev">▶</span><div class="grow"><b>${se}. Sezon</b> <span class="t3">${w}/${eps.length}</span></div>
          ${aired.length ? `<button class="btn ${allW ? 'ghost' : ''}" data-season="${s.id}:${se}" data-val="${allW ? 0 : 1}">${allW ? 'İşareti kaldır' : 'Sezonu izledim'}</button>` : '<span class="pill">Yakında</span>'}
        </summary>
        ${eps.map(e => `<div class="ep ${isAired(e) ? '' : 'future'}">
          <button class="check ${e.w ? 'on' : ''}" data-toggle="${e.i}">${CHECK}</button>
          <div class="grow"><div class="t1" style="font-weight:600"><span class="code">${e.n}.</span> ${esc(e.t)}</div>
            <div class="t3">${dateLabel(e)}</div></div>
          ${isAired(e) && !e.w ? `<button class="upto" data-upto="${e.i}" title="Bu bölüm dahil öncekilerin hepsini izlendi yap">buraya kadar ✓</button>` : ''}
        </div>`).join('')}
      </details>`;
    }).join('')}`;
}
function openDetail(id) {
  S.openShow = Number(id);
  $('#detail').dataset.show = '';
  renderDetail();
  $('#sheet').classList.add('open');
  $('#sheet').scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function closeDetail() {
  S.openShow = null;
  $('#sheet').classList.remove('open');
  document.body.style.overflow = '';
}

/* ───────── İşlemler ───────── */
async function setWatched(ids, val, undoable) {
  ids = ids.filter(i => { const e = S.data.eps.find(x => x.i === i); return e && e.w !== val; });
  if (!ids.length) return;
  const set = new Set(ids), now = new Date().toISOString();
  S.data.eps.forEach(e => { if (set.has(e.i)) { e.w = val; e.wt = val ? now : ''; } });
  index(); render();
  if (undoable) toast(ids.length === 1 ? 'İzlendi olarak işaretlendi' : ids.length + ' bölüm işaretlendi', 'Geri al', () => setWatched(ids, !val));
  try {
    await call('setWatched', ids, val);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(S.data)); } catch (e) {}
  } catch (err) {
    S.data.eps.forEach(e => { if (set.has(e.i)) { e.w = !val; e.wt = ''; } });
    index(); render();
    toast('Kaydedilemedi: ' + (err.message || err), null, null, true);
  }
}
async function addShow(id) {
  id = Number(id);
  S.adding[id] = true;
  // İyimser ekleme: arama sonucundaki bilgilerle dizi hemen listede görünsün, bölümler sunucudan gelince dolsun
  const r = (S.searchRes || []).find(x => x.id === id);
  const placeholder = r && !showMap[id];
  if (placeholder) {
    S.data.shows.push({ id, ad: r.ad, imdb: r.imdb, durum: r.durum, kanal: r.kanal, yil: r.yil, poster: r.poster, url: '', aktif: true, eklenme: '', senkron: '' });
    index();
  }
  render();
  toast('Ekleniyor… bölümler birkaç saniyede gelecek');
  try {
    setData(await call('addShow', id));
    toast('Eklendi! Kaldığın yeri işaretle.', 'Aç', () => openDetail(id));
  } catch (err) {
    if (placeholder) { S.data.shows = S.data.shows.filter(s => !(s.id === id && !s.senkron)); index(); }
    toast('Eklenemedi: ' + (err.message || err), null, null, true);
  }
  delete S.adding[id]; render();
}
async function doSearch(q) {
  S.searchQ = q; if (!q.trim()) return;
  S.searching = true; render();
  try { S.searchRes = await call('search', q); }
  catch (err) { S.searchRes = []; toast('Arama başarısız: ' + (err.message || err), null, null, true); }
  S.searching = false; render();
  const inp = $('#q'); if (inp) inp.blur();
}
async function sync() {
  const b = $('#syncBtn'); if (b.classList.contains('spin')) return;
  b.classList.add('spin'); $('#syncTxt').textContent = 'güncelleniyor';
  try {
    const d = await call('sync');
    setData(d);
    const r = d.syncResult || {};
    toast(r.hatalar && r.hatalar.length ? r.hatalar.length + ' dizi güncellenemedi' : (r.guncellenen || 0) + ' dizi güncellendi', null, null, !!(r.hatalar && r.hatalar.length));
  } catch (err) { toast('Güncellenemedi: ' + (err.message || err), null, null, true); }
  b.classList.remove('spin'); $('#syncTxt').textContent = since(S.data.lastSync);
}
function confirmBox(title, text, yes) {
  return new Promise(res => {
    $('#mT').textContent = title; $('#mP').textContent = text; $('#mYes').textContent = yes || 'Tamam';
    $('#modal').classList.add('open');
    const done = v => { $('#modal').classList.remove('open'); $('#mYes').onclick = $('#mNo').onclick = null; res(v); };
    $('#mYes').onclick = () => done(true); $('#mNo').onclick = () => done(false);
  });
}
let toastT;
function toast(msg, action, fn, err) {
  const t = $('#toast');
  t.className = 'toast show' + (err ? ' err' : '');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button>${esc(action)}</button>` : '');
  if (action) t.querySelector('button').onclick = () => { t.classList.remove('show'); fn(); };
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), action ? 5000 : 3000);
}

/* ───────── Olaylar ───────── */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('button, a'); if (!el) return;
  const d = el.dataset;
  if (el.closest('summary') && (d.season)) ev.preventDefault();
  if (d.tab) { S.tab = d.tab; closeDetail(); render(); window.scrollTo(0, 0); return; }
  if (d.open) { openDetail(d.open); return; }
  if (el.id === 'back') { closeDetail(); render(); return; }
  if (el.id === 'syncBtn') { sync(); return; }
  if (el.id === 'meBtn') { if (await confirmBox('Çıkış yapılsın mı?', 'Bu cihazdaki önbellek de temizlenir.', 'Çıkış')) signOut(); return; }
  if (d.filter) { S.showFilter = d.filter; render(); return; }
  if (d.watch) { setWatched([Number(d.watch)], true, true); return; }
  if (d.toggle) { const e = S.data.eps.find(x => x.i === Number(d.toggle)); if (e) setWatched([e.i], !e.w); return; }
  if (d.upto) {
    const tgt = S.data.eps.find(x => x.i === Number(d.upto));
    const ids = (byShow[tgt.s] || []).filter(e => (e.se < tgt.se || (e.se === tgt.se && e.n <= tgt.n)) && !e.w).map(e => e.i);
    setWatched(ids, true, true); return;
  }
  if (d.season) {
    const [sid, se] = d.season.split(':').map(Number);
    const ids = (byShow[sid] || []).filter(e => e.se === se && isAired(e)).map(e => e.i);
    setWatched(ids, d.val === '1', true); return;
  }
  if (d.add) { addShow(Number(d.add)); return; }
  if (d.active) {
    try { setData(await call('setActive', Number(d.active), d.val === '1')); toast(d.val === '1' ? 'Takibe geri alındı' : 'Arşivlendi — takvim etkinlikleri kaldırıldı'); }
    catch (err) { toast('Olmadı: ' + (err.message || err), null, null, true); }
    return;
  }
  if (d.del) {
    const s = showMap[d.del];
    if (!await confirmBox(s.ad + ' silinsin mi?', 'Dizi, izleme geçmişi ve takvim etkinlikleri silinir. Sadece listeden kaldırmak istiyorsan "Arşivle"yi kullan.', 'Sil')) return;
    closeDetail();
    try { setData(await call('deleteShow', Number(d.del))); toast('Silindi'); }
    catch (err) { toast('Silinemedi: ' + (err.message || err), null, null, true); }
  }
});
document.addEventListener('submit', ev => {
  if (ev.target.id === 'searchForm') { ev.preventDefault(); doSearch($('#q').value); }
});

/* ───────── Başlat ───────── */
let booted = false;
async function boot() {
  const s = session();
  if (!s) { showGate(); return; }
  booted = true;
  $('#gate').classList.remove('open');
  if (s.picture) { $('#meBtn').innerHTML = `<img src="${esc(s.picture)}" alt="" referrerpolicy="no-referrer">`; }
  else { $('#meBtn').textContent = '⏻'; }
  $('#meBtn').hidden = false;
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (c && c.shows) { S.data = c; index(); render(); }
  } catch (e) {}
  try { setData(await call('getData')); }
  catch (err) {
    if (err.code === 'auth' || err.code === 'forbidden') {
      booted = false; localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(CACHE_KEY);
      $('#meBtn').hidden = true; showGate(err.message); return;
    }
    $('#main').innerHTML = `<div class="empty"><div class="big">⚠️</div>Veriler yüklenemedi.<br><small>${esc(err.message || err)}</small></div>`;
  }
  if (!S.data.shows.length) { S.tab = 'add'; render(); }
}
boot();
setInterval(() => { if (S.tab !== 'add' || S.openShow) render(); }, 5 * 60 * 1000); // "bugün/yarın" etiketleri tazelensin
</script>
</body>
</html>
